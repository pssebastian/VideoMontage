identity:
  name: "Midnight Keynote"
  category: cinematic
  mood: "authoritative, sleek, visionary, cinematic"
  pace: deliberate
  best_for: "Product keynotes, technical launches, visionary announcements, high-end explainers"

taste_profile:
  design_read: "Midnight Keynote: high-contrast dark mode, volumetric lighting accents, surgical typographic hierarchy, calm authority."
  visual_variance: 4
  motion_intensity: 3
  information_density: 5
  palette_discipline: "Matte obsidian field, titanium white typography, electric sapphire and icy cyan focal accents, no extraneous rainbows."
  layout_variation: "Alternate centered monolithic statement frames, clean technical breakdown splits, and full-bleed high-fidelity asset moments."
  reference_strategy: "Create one hero reference still establishing obsidian depth and sapphire rim-light before generating scene assets."
  anti_patterns:
    - "light grey corporate template cards"
    - "muddy saturated rainbow gradients"
    - "hyperactive fast-paced meme cuts"
    - "cluttered backgrounds that obscure typographic focal points"
  quality_gates:
    - "Text must maintain at least 7:1 contrast against dark obsidian canvas."
    - "Sapphire and cyan accents must be reserved exclusively for hero emphasis, key terms, or data charts."

visual_language:
  color_palette:
    primary: ["#15151B", "#22222B"]
    accent: ["#0A84FF", "#5AC8FA"]
    background: "#0B0B0E"
    text: "#F5F5F7"
    muted: "#8E8E93"
  composition: "monolithic centered focus with expansive negative space, cinematic aspect ratios, subtle depth layering"
  texture: "matte obsidian surfaces, ultra-fine 1px slate divider borders, soft atmospheric backlight glows"

typography:
  headings:
    font: "Inter"
    weight: 700
    tracking: "-0.02em"
  body:
    font: "Inter"
    weight: 400
    line_height: 1.6
  code:
    font: "JetBrains Mono"
    weight: 400
  stat_card:
    font: "Inter"
    weight: 800
    size_multiplier: 3.5
  scale_system: "major_third"
  weight_matrix:
    title: 800
    heading: 700
    body: 400
    caption: 500

motion:
  transitions: [fade, dissolve, slide-left, pop]
  animation_style: "silky spring physics, smooth ease-out curves, zero chaotic overshoot"
  pacing_rules:
    min_scene_hold_seconds: 2.5
    max_scene_hold_seconds: 7.0
    text_card_hold_seconds: 3.5
    stat_card_hold_seconds: 3.0
    transition_duration_seconds: 0.4
  entrance: "gentle fade-up 10px with soft scale from 0.98"
  exit: "subtle fade with smooth ease-out"

audio:
  voice_style: "confident, measured, authoritative neutral or deep baritone with warm clarity"
  music_mood: "subtle ambient sub-bass pulse, clean minimal synth pads, cinematic anticipation"
  music_volume: 0.08
  sfx_style: "deep subtle thuds, soft UI glass clicks, clean electronic hums"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "cinematic product keynote frame, matte obsidian dark background, volumetric electric sapphire and icy cyan rim lighting, sleek modern minimalism, 8k resolution, photorealistic, elegant depth of field, "
  image_negative_prompt: "bright white background, cartoonish, messy, grainy, cluttered, generic stock photo, saturated rainbow colors, low resolution"
  diagram_style: "dark mode technical architecture schematic, glowing electric sapphire connection paths, titanium white labels, obsidian card surfaces"
  consistency_anchors:
    - "Obsidian #0B0B0E dark canvas with titanium white #F5F5F7 text"
    - "Electric sapphire #0A84FF used strictly as visual focal point"
    - "Ultra-fine 1px slate borders (#22222B) with rounded geometry"
    - "Deep, calm, high-budget tech keynote atmosphere"

overlays:
  stat_card:
    bg: "#15151B"
    border: "#22222B"
    radius: 8
    shadow: "0 4px 24px rgba(0,0,0,0.5)"
  key_term:
    bg: "rgba(10,132,255,0.12)"
    text: "#5AC8FA"
    radius: 4
  code_block:
    bg: "#15151B"
    text: "#F5F5F7"
    highlight: "#0A84FF"

quality_rules:
  - "Minimum contrast ratio 7:1 for headline titanium text on obsidian background"
  - "Never exceed 2 accent colors (sapphire/cyan) on screen simultaneously"
  - "Maintain generous breathing room around text and focal visual assets"
  - "Motion transitions must feel deliberate and controlled, never rushed"

chart_palette:
  - "#0A84FF"
  - "#5AC8FA"
  - "#30D158"
  - "#FF9F0A"
  - "#BF5AF2"

color_rules:
  harmony_type: "analogous"
  contrast_validation: true
  colorblind_safe: true
